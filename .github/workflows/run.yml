name: Run on Windows
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Файл (labs/lab-1/task1.cpp) или папка (labs/lab-1) — тогда запустятся все .cpp в ней'
        required: true
        default: 'labs/lab-1'

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "${{ inputs.path }}"
          if (Test-Path $target -PathType Container) {
            $files = Get-ChildItem $target -Filter *.cpp | Sort-Object Name
          } else {
            $files = @(Get-Item $target)
          }
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          foreach ($f in $files) {
            Write-Host "===== $($f.Name) ====="
            cl /nologo /O2 /EHsc /std:c++17 /Fe:app.exe $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($f.Name)" }

            $resDir = Join-Path $f.DirectoryName 'results'
            New-Item -ItemType Directory -Force -Path $resDir | Out-Null
            $out = Join-Path $resDir ($f.BaseName + '.md')

            $text = .\app.exe | Out-String
            if ($LASTEXITCODE -ne 0) { throw "Run failed: $($f.Name)" }
            $header = "_Run: $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC, CPU: $cpu, MSVC Release /O2_`n`n"
            Set-Content -Path $out -Value ($header + $text) -Encoding utf8NoBOM
            Write-Host $text
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($header + $text)
          }

      - name: Commit results
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A labs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes"; exit 0 }
          git commit -m "Results: ${{ inputs.path }}"
          git pull --rebase
          git push
